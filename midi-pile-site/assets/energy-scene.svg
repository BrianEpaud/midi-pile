<svg xmlns="http://www.w3.org/2000/svg" class="energy-svg energy-scene energy-map" viewBox="0 0 600 560" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Les chemins de votre électricité</title><desc id="diagram-desc">Schéma de principe à plat : les panneaux et leur onduleur alimentent la maison. Le surplus peut rejoindre la batterie, la borne ou le réseau. Les flèches changent de sens selon l’heure choisie ; la batterie et le réseau peuvent aussi alimenter les usages.</desc>
<defs><marker id="map-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="context-stroke" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="map-tracks" fill="none" stroke-width="3" stroke-linejoin="round"><path d="M300 166V232M270 264H165M330 264H435M280 286V355H150V394M320 286V355H450V394"/></g>
<g class="map-flows" fill="none" stroke-linecap="round" stroke-linejoin="round"><path id="flow-solar" class="flow solar" d="M300 176V222"/><path id="flow-house" class="flow" d="M340 264H425"/><path id="flow-grid" class="flow grid" d="M260 264H175"/><path id="flow-battery" class="flow" d="M280 297V355H150V384"/><path id="flow-car" class="flow" d="M320 297V355H450V384"/></g>
<circle class="map-hub" cx="300" cy="264" r="32"/><path class="hub-symbol" d="M289 264H311M300 253V275" fill="none" stroke-width="2" stroke-linecap="round"/>
<g class="map-node solar-panels" transform="translate(200 40)"><rect class="map-card" width="200" height="126" rx="18"/><g class="map-icon" transform="translate(77 16)" fill="none" stroke-width="2"><rect width="46" height="30" rx="3"/><path d="M15 0V30M31 0V30M0 15H46M23 30V38M13 38H33"/></g><text class="map-title" x="100" y="83">Panneaux solaires</text><text class="map-sub" x="100" y="106">avec leur onduleur</text></g>
<g class="map-node scene-grid" transform="translate(15 205)"><rect class="map-card" width="150" height="126" rx="18"/><g class="map-icon" transform="translate(55 15)" fill="none" stroke-width="2"><path d="M20 0 8 38M20 0 32 38M5 12H35M1 23H39M13 23 29 38M27 23 11 38M20 0V-2"/></g><text class="map-title" x="75" y="84">Réseau</text><text class="map-sub" x="75" y="107">le complément</text></g>
<g class="map-node house-model" transform="translate(435 205)"><rect class="map-card" width="150" height="126" rx="18"/><g class="map-icon" transform="translate(53 14)" fill="none" stroke-width="2"><path d="M0 18 22 0 44 18M6 14V40H38V14M17 40V25H27V40"/></g><text class="map-title" x="75" y="84">Maison</text><text class="map-sub" x="75" y="107">vos usages</text></g>
<g class="map-node scene-battery" transform="translate(65 394)"><rect class="map-card" width="170" height="126" rx="18"/><g class="map-icon" transform="translate(70 14)" fill="none" stroke-width="2"><rect x="0" y="4" width="30" height="38" rx="5"/><path d="M10 4V0H20V4M8 16H22M8 25H22M8 34H22"/></g><text class="map-title" x="85" y="84">Batterie</text><text class="map-sub" x="85" y="107">stocker / restituer</text></g>
<g class="map-node scene-car" transform="translate(365 394)"><rect class="map-card" width="170" height="126" rx="18"/><g class="map-icon" transform="translate(66 14)" fill="none" stroke-width="2"><rect width="27" height="40" rx="5"/><path d="M8 9H19V18H8ZM27 11C45 11 30 36 42 36V20M38 20H46V13M42 13V8M3 40H24"/></g><text class="map-title" x="85" y="84">Borne</text><text class="map-sub" x="85" y="107">recharger le véhicule</text></g>
